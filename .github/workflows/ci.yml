name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  DOTNET_VERSION: '10.0.x'
  DOTNET_NOLOGO: true

jobs:
  build:
    name: Build and test (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore LiveHelpDesk.slnx

      - name: Build
        run: dotnet build LiveHelpDesk.slnx --no-restore --configuration Release

      - name: Test
        run: dotnet test tests/LiveHelpDesk.Tests --no-build --configuration Release --logger "trx;LogFileName=test-results.trx"

      - name: Test contatore installazioni
        shell: powershell
        run: .\installer\tests\install-counter.tests.ps1

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: '**/test-results.trx'

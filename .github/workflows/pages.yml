name: Pages

# Pubblica il sito del manuale (cartella docs/) su GitHub Pages, insieme a update.json: il manifesto che le app
# installate leggono per sapere se c'e` una versione piu' recente. update.json viene preso dall'ultima Release
# (lo genera il workflow Release, che al termine riavvia anche questo workflow).
# Per attivarlo la prima volta: Impostazioni del repository -> Pages -> Source = "GitHub Actions".
on:
  push:
    branches: [main]
    paths: ['docs/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Pubblica il manuale
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Configura Pages
        uses: actions/configure-pages@v5

      - name: Aggiungi update.json dall'ultima Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release download --repo "${{ github.repository }}" --pattern update.json --dir docs --clobber; then
            cat docs/update.json
          else
            echo "::warning::Nessuna Release con update.json: il sito viene pubblicato senza manifesto degli aggiornamenti."
          fi

      - name: Carica il sito
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy su Pages
        id: deployment
        uses: actions/deploy-pages@v4

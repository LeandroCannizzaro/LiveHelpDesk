name: Release

# Produce i due artefatti di pubblicazione (MSI e ZIP portatile) e, quando si crea un tag "vX.Y.Z",
# li allega a una Release di GitHub. Si puo' anche avviare a mano (workflow_dispatch) per un pacchetto di prova.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Versione x.y.z (vuoto = usa VersionPrefix di Directory.Build.props)'
        required: false

env:
  DOTNET_VERSION: '10.0.x'
  DOTNET_NOLOGO: true

permissions:
  contents: write
  actions: write

jobs:
  package:
    name: Pacchetto MSI + ZIP (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # tutta la storia e i tag: servono a trovare le modifiche dall'ultimo rilascio
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Determina la versione
        id: version
        shell: pwsh
        run: |
          $v = '${{ github.event.inputs.version }}'
          if (-not $v -and '${{ github.ref_type }}' -eq 'tag') { $v = '${{ github.ref_name }}' -replace '^v', '' }
          if (-not $v) {
            $v = ([xml](Get-Content Directory.Build.props)).Project.PropertyGroup.VersionPrefix | Where-Object { $_ } | Select-Object -First 1
          }
          if ($v -notmatch '^\d+\.\d+\.\d+(\.\d+)?$') { throw "Versione non valida: '$v' (serve x.y.z)" }
          "version=$v" >> $env:GITHUB_OUTPUT
          Write-Host "Versione: $v"

      # Ogni pubblicazione ha le sue note (docs/release-notes.html, sezione id="vX.Y.Z") e il manuale aggiornato.
      - name: Verifica note di rilascio e manuale (solo sui tag)
        if: github.ref_type == 'tag'
        shell: pwsh
        run: ./installer/release-notes.ps1 -Check -Version ${{ steps.version.outputs.version }}

      - name: Costruisci l'MSI (pubblica anche la cartella app)
        shell: pwsh
        run: ./installer/build-msi.ps1 -Version ${{ steps.version.outputs.version }} -Output artifacts

      - name: Costruisci lo ZIP portatile
        shell: pwsh
        run: ./installer/build-zip.ps1 -Version ${{ steps.version.outputs.version }} -Package artifacts/package/app -Output artifacts

      # Il manifesto letto dall'app per l'aggiornamento automatico: versione, indirizzi degli asset della Release e loro SHA-256.
      # Viene allegato alla Release e poi pubblicato su GitHub Pages (workflow Pages) come update.json.
      - name: Genera update.json
        shell: pwsh
        run: |
          $v = '${{ steps.version.outputs.version }}'
          $tag = if ('${{ github.ref_type }}' -eq 'tag') { '${{ github.ref_name }}' } else { "v$v" }
          $base = "https://github.com/${{ github.repository }}/releases/download/$tag"
          function Package($name) {
            $file = Get-Item (Join-Path artifacts $name)
            [ordered]@{ url = "$base/$name"; sha256 = (Get-FileHash $file -Algorithm SHA256).Hash.ToLowerInvariant(); size = $file.Length }
          }
          [ordered]@{
            version     = $v
            publishedAt = (Get-Date).ToUniversalTime().ToString('o')
            notesUrl    = "https://leandrocannizzaro.github.io/LiveHelpDesk/release-notes.html#v$v"
            msi         = Package "LiveHelpDesk-$v-x64.msi"
            zip         = Package "LiveHelpDesk-$v-win-x64.zip"
          } | ConvertTo-Json -Depth 3 | Set-Content artifacts/update.json -Encoding utf8
          Get-Content artifacts/update.json

      - name: Carica l'artefatto MSI
        uses: actions/upload-artifact@v4
        with:
          name: LiveHelpDesk-${{ steps.version.outputs.version }}-msi
          path: artifacts/LiveHelpDesk-${{ steps.version.outputs.version }}-x64.msi
          if-no-files-found: error

      - name: Carica l'artefatto ZIP
        uses: actions/upload-artifact@v4
        with:
          name: LiveHelpDesk-${{ steps.version.outputs.version }}-zip
          path: artifacts/LiveHelpDesk-${{ steps.version.outputs.version }}-win-x64.zip
          if-no-files-found: error

      - name: Pubblica la Release (solo sui tag)
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          name: LiveHelpDesk ${{ steps.version.outputs.version }}
          body: |
            📄 Note di rilascio: https://leandrocannizzaro.github.io/LiveHelpDesk/release-notes.html#v${{ steps.version.outputs.version }}
            📖 Manuale d'uso: https://leandrocannizzaro.github.io/LiveHelpDesk/
          files: |
            artifacts/LiveHelpDesk-${{ steps.version.outputs.version }}-x64.msi
            artifacts/LiveHelpDesk-${{ steps.version.outputs.version }}-win-x64.zip
            artifacts/update.json
          generate_release_notes: true

      # Ripubblica Pages (dal ramo main, l'unico ammesso dall'ambiente github-pages) con il nuovo update.json:
      # da quel momento le app installate vedono l'aggiornamento. workflow_dispatch e` l'unico evento che il
      # GITHUB_TOKEN puo' far partire.
      - name: Aggiorna il manifesto su GitHub Pages (solo sui tag)
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --repo ${{ github.repository }} --ref ${{ github.event.repository.default_branch }}
